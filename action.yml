name: Telemetry Change Guard
description: Detect downstream impact before telemetry changes reach production
author: Telemetry Change Guard contributors

branding:
  icon: activity
  color: purple

inputs:
  config:
    description: Path to the product configuration relative to the repository root
    required: false
    default: tcg.yaml
  changes:
    description: Path to a generic ChangeSet; mutually exclusive with other change sources and migration
    required: false
    default: ""
  baseline:
    description: Path to a baseline TelemetrySnapshot; requires candidate
    required: false
    default: ""
  candidate:
    description: Path to a candidate TelemetrySnapshot; requires baseline
    required: false
    default: ""
  weaver-diff:
    description: Path to a Weaver registry diff; requires weaver-mapping
    required: false
    default: ""
  weaver-mapping:
    description: Path to an explicit Weaver backend mapping; requires weaver-diff
    required: false
    default: ""
  migration:
    description: Path to a legacy migration manifest; mutually exclusive with every generic change source
    required: false
    default: ""
  comment:
    description: Create or update a pull-request comment
    required: false
    default: "true"
  artifact-name:
    description: Name of the uploaded JSON evidence artifact
    required: false
    default: telemetry-change-guard-report
  remote-evidence:
    description: Remote evidence policy; disabled by default and enabled only by a trusted workflow
    required: false
    default: disabled
  allowed-remote-origins:
    description: Newline-separated exact origins supplied by trusted workflow configuration; required when remote evidence is enabled
    required: false
    default: ""
  allow-insecure-loopback:
    description: Allow bearer authentication over HTTP only to an allowlisted loopback development endpoint
    required: false
    default: "false"
  remote-bearer-token:
    description: Optional bearer token exposed to analysis only as TCG_REMOTE_BEARER_TOKEN
    required: false
    default: ""

outputs:
  status:
    description: PASS, WARN, BLOCK, READY, BLOCKED, INCOMPLETE, or ERROR
    value: ${{ steps.analyze.outputs.status }}
  exit-code:
    description: Analyzer process exit code
    value: ${{ steps.analyze.outputs.exit-code }}
  report:
    description: Path to the generated Markdown report
    value: ${{ steps.analyze.outputs.report }}
  json-report:
    description: Path to the generated versioned JSON result
    value: ${{ steps.analyze.outputs.json-report }}
  mode:
    description: generic, migration, or invalid for input configuration errors
    value: ${{ steps.analyze.outputs.mode }}

runs:
  using: composite
  steps:
    - name: Resolve Action dependency paths
      id: action-paths
      shell: bash
      run: "${GITHUB_ACTION_PATH}/action/resolve-action-paths.sh"

    - name: Set up official Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ steps.action-paths.outputs.go-mod }}
        # Action-owned modules live outside a consumer's workspace, where
        # setup-go cannot resolve dependency paths for its repository cache.
        cache: false

    - name: Build Telemetry Change Guard
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        TCG_ACTION_REF: ${{ github.action_ref }}
        TCG_ACTION_REPOSITORY: ${{ github.action_repository }}
        TCG_WORKFLOW_REPOSITORY: ${{ github.repository }}
        TCG_WORKFLOW_SHA: ${{ github.sha }}
      run: "${GITHUB_ACTION_PATH}/action/build-action.sh"

    - name: Record build identity
      shell: bash
      run: |
        {
          printf '## Telemetry Change Guard build identity\n\n```text\n'
          "${RUNNER_TEMP}/telemetry-change-guard" version
          printf '```\n\n'
        } >> "${GITHUB_STEP_SUMMARY}"

    - name: Analyze telemetry change
      id: analyze
      shell: bash
      env:
        TCG_CONFIG: ${{ inputs.config }}
        TCG_CHANGES: ${{ inputs.changes }}
        TCG_BASELINE: ${{ inputs.baseline }}
        TCG_CANDIDATE: ${{ inputs.candidate }}
        TCG_WEAVER_DIFF: ${{ inputs.weaver-diff }}
        TCG_WEAVER_MAPPING: ${{ inputs.weaver-mapping }}
        TCG_MIGRATION: ${{ inputs.migration }}
        TCG_REMOTE_EVIDENCE: ${{ inputs.remote-evidence }}
        TCG_ALLOWED_REMOTE_ORIGINS: ${{ inputs.allowed-remote-origins }}
        TCG_ALLOW_INSECURE_LOOPBACK: ${{ inputs.allow-insecure-loopback }}
        TCG_REMOTE_BEARER_TOKEN: ${{ inputs.remote-bearer-token }}
      run: "${GITHUB_ACTION_PATH}/action/run-action.sh"

    - name: Upload JSON evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.analyze.outputs.json-report }}
        if-no-files-found: error

    - name: Post pull-request summary
      if: always() && github.event_name == 'pull_request' && inputs.comment == 'true'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      continue-on-error: true
      env:
        TCG_REPORT_PATH: ${{ steps.analyze.outputs.report }}
      with:
        github-token: ${{ github.token }}
        script: |
          const fs = require('fs');
          const marker = '<!-- telemetry-change-guard -->';
          const legacyMarker = '<!-- telemetry-migration-readiness -->';
          const report = fs.readFileSync(process.env.TCG_REPORT_PATH, 'utf8');
          const suffix = '\n\n_Report truncated. Full JSON evidence is available in the workflow artifact._';
          const limit = 65536;
          const prefix = `${marker}\n`;
          const visibleReport = prefix.length + report.length <= limit
            ? report
            : `${report.slice(0, limit - prefix.length - suffix.length)}${suffix}`;
          const body = `${prefix}${visibleReport}`;
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            per_page: 100,
          });
          const existing = comments.find(comment =>
            comment.user?.type === 'Bot' &&
            (comment.body?.includes(marker) || comment.body?.includes(legacyMarker)));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }

    - name: Enforce deterministic result
      if: always()
      shell: bash
      env:
        TCG_EXIT_CODE: ${{ steps.analyze.outputs.exit-code }}
      run: exit "${TCG_EXIT_CODE:-1}"
