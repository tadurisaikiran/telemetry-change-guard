name: Release Snapshot

on:
  pull_request:
    paths:
      - .goreleaser.yaml
      - .github/workflows/release-snapshot.yml
      - .github/workflows/release.yml
      - go.mod
      - go.sum
      - Makefile
      - cmd/**
      - internal/releasetool/**
      - internal/version/**
      - release/**
      - scripts/build-release.sh
      - scripts/install-release-tools.sh
      - scripts/validate-release-tag.sh
      - scripts/verify-release.sh
      - scripts/verify-reproducible-release.sh
      - scripts/generate-homebrew-formula.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-snapshot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install locked GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.0
          install-only: true

      - name: Install locked Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.51.0

      - name: Validate GoReleaser configuration
        env:
          TCG_SYFT: ${{ steps.syft.outputs.cmd }}
        run: goreleaser check --config .goreleaser.yaml

      - name: Build, verify, and reproduce candidate payload
        env:
          GORELEASER: goreleaser
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: make release-reproducible

      - name: Generate checksum-bound Homebrew formula
        run: make homebrew-formula

      - name: Retain verified candidate payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tcg-release-snapshot-${{ github.sha }}
          path: |
            dist/release/
            dist/homebrew/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  platform-smoke:
    needs: build-and-verify
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Download exact candidate payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tcg-release-snapshot-${{ github.sha }}
          path: dist

      - name: Verify and execute the native candidate archive
        run: go run ./internal/releasetool verify --dir dist/release
