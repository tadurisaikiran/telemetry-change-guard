name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "29 5 * * 3"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: go
          queries: security-extended

      - name: Build for analysis
        uses: github/codeql-action/autobuild@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8

      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: /language:go
          output: ${{ runner.temp }}/codeql-results

      - name: Require complete CodeQL extraction
        env:
          TCG_CODEQL_SARIF: ${{ steps.analyze.outputs.sarif-output }}
        run: go run ./internal/codeqlverify --path "${TCG_CODEQL_SARIF}"
