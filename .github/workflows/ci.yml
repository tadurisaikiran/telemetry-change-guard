name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            echo "The following files require gofmt:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Parser fuzz smoke tests
        run: |
          go test ./internal/config -run=^$ -fuzz=FuzzParseConfigDoesNotPanic -fuzztime=3s
          go test ./internal/config -run=^$ -fuzz=FuzzParseChangeSetDoesNotPanic -fuzztime=3s
          go test ./internal/snapshot -run=^$ -fuzz=FuzzParseSnapshotDoesNotPanic -fuzztime=3s
          go test ./pkg/promql -run=^$ -fuzz=FuzzAnalyze -fuzztime=5s
          go test ./pkg/traceql -run=^$ -fuzz=FuzzAnalyzeDoesNotPanic -fuzztime=5s
          go test ./adapters/weaver -run=^$ -fuzz=FuzzParseDiffDoesNotPanic -fuzztime=3s
          go test ./adapters/weaver -run=^$ -fuzz=FuzzParseMappingDoesNotPanic -fuzztime=3s
          go test ./adapters/persesusage -run=^$ -fuzz=FuzzDecodeMetricsDoesNotPanic -fuzztime=3s
          go test ./adapters/runtimequeries -run=^$ -fuzz=FuzzDecodePrometheusQueryLog -fuzztime=3s
          go test ./adapters/runtimequeries -run=^$ -fuzz=FuzzDecodeTMRQueryHistory -fuzztime=3s
          go test ./adapters/keda -run=^$ -fuzz=FuzzParseDoesNotPanic -fuzztime=3s
          go test ./adapters/argorollouts -run=^$ -fuzz=FuzzParseDoesNotPanic -fuzztime=3s
          go test ./adapters/hpa -run=^$ -fuzz=FuzzParseMappingDoesNotPanic -fuzztime=3s
          go test ./adapters/hpa -run=^$ -fuzz=FuzzParseManifestDoesNotPanic -fuzztime=3s
          go test ./adapters/cloudformation -run=^$ -fuzz=FuzzParseTemplateDoesNotPanic -fuzztime=3s
          go test ./adapters/cloudformation -run=^$ -fuzz=FuzzParseManifestDoesNotPanic -fuzztime=3s
          go test ./internal/explanation -run=^$ -fuzz=FuzzDecodeResponseDoesNotPanic -fuzztime=3s
          go test ./internal/remediation -run=^$ -fuzz=FuzzDecodeResponseDoesNotPanic -fuzztime=3s

      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  action-smoke:
    name: action-${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: generic
            expected_mode: generic
            changes: action/testdata/changes.yaml
            baseline: ""
            candidate: ""
            migration: ""
            status: WARN
          - mode: snapshot
            expected_mode: generic
            changes: ""
            baseline: action/testdata/snapshots/baseline.json
            candidate: action/testdata/snapshots/candidate.json
            migration: ""
            status: WARN
          - mode: migration
            expected_mode: migration
            changes: ""
            baseline: ""
            candidate: ""
            migration: action/testdata/migration.yaml
            status: READY

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run local dual-mode Action
        id: guard
        uses: ./
        with:
          config: action/testdata/tcg.yaml
          changes: ${{ matrix.changes }}
          baseline: ${{ matrix.baseline }}
          candidate: ${{ matrix.candidate }}
          migration: ${{ matrix.migration }}
          comment: "false"
          artifact-name: telemetry-change-guard-${{ matrix.mode }}

      - name: Verify Action outputs
        shell: bash
        env:
          TCG_ACTUAL_MODE: ${{ steps.guard.outputs.mode }}
          TCG_ACTUAL_STATUS: ${{ steps.guard.outputs.status }}
          TCG_ACTUAL_EXIT: ${{ steps.guard.outputs.exit-code }}
          TCG_EXPECTED_MODE: ${{ matrix.expected_mode }}
          TCG_EXPECTED_STATUS: ${{ matrix.status }}
        run: |
          [[ "${TCG_ACTUAL_MODE}" == "${TCG_EXPECTED_MODE}" ]]
          [[ "${TCG_ACTUAL_STATUS}" == "${TCG_EXPECTED_STATUS}" ]]
          [[ "${TCG_ACTUAL_EXIT}" == "0" ]]
