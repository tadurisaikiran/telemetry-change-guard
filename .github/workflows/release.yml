name: Public Alpha Release

on:
  push:
    tags:
      - v*-alpha.*

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Fetch protected main history
        run: git fetch --no-tags origin main

      - name: Validate exact annotated candidate tag
        run: ./scripts/validate-release-tag.sh

      - name: Run full verifier
        run: make verify

      - name: Run pinned end-to-end lifecycles
        run: make e2e

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: public-alpha
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Fetch protected main history
        run: git fetch --no-tags origin main

      - name: Revalidate exact annotated candidate tag
        run: ./scripts/validate-release-tag.sh

      - name: Install locked GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.0
          install-only: true

      - name: Install locked Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.51.0

      - name: Build and verify tagged payload without publishing
        env:
          GORELEASER: goreleaser
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: make release-tag

      - name: Retain verified release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tcg-release-${{ github.sha }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Attest release payload provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/*

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TCG_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TCG_RELEASE_TAG}" dist/release/* \
            --verify-tag \
            --prerelease \
            --title "Telemetry Change Guard ${TCG_RELEASE_TAG}" \
            --notes-file release/RELEASE_NOTES.md
