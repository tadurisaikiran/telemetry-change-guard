name: Upstream Compatibility

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protected-test:
    if: github.event_name == 'workflow_dispatch'
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Run the protected test gate
        run: make verify

  protected-live-lifecycle:
    if: github.event_name == 'workflow_dispatch'
    name: live-lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run the protected live lifecycle
        run: ./e2e/scripts/run-e2e.sh

  protected-trace-lifecycle:
    if: github.event_name == 'workflow_dispatch'
    name: trace-lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run the protected Tempo lifecycle
        run: ./e2e/scripts/run-tempo-e2e.sh

  live-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pinned
            prometheus: prom/prometheus:v3.13.2
            grafana: grafana/grafana:13.1.3
            sloth: ghcr.io/slok/sloth:v0.16.0
          - name: previous-supported
            prometheus: prom/prometheus:v3.5.5
            grafana: grafana/grafana:13.0.6
            sloth: ghcr.io/slok/sloth:v0.15.0
          - name: upstream-latest
            prometheus: prom/prometheus:latest
            grafana: grafana/grafana:latest
            sloth: ghcr.io/slok/sloth:latest

    name: ${{ matrix.name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run compatibility lifecycle
        env:
          TMR_PROMETHEUS_IMAGE: ${{ matrix.prometheus }}
          TMR_GRAFANA_IMAGE: ${{ matrix.grafana }}
          TMR_SLOTH_IMAGE: ${{ matrix.sloth }}
        run: ./e2e/scripts/run-e2e.sh
