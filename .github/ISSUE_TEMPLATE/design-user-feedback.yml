name: Design-user feedback
description: Share a sanitized result from a real or representative TCG evaluation
title: "feedback: "
labels:
  - enhancement
  - "area: testing"
body:
  - type: markdown
    attributes:
      value: >-
        This issue is public. Do not include credentials, production endpoints,
        customer data, proprietary queries, or unredacted telemetry. Construct a
        synthetic reproduction when the original artifacts cannot be shared.
  - type: input
    id: version
    attributes:
      label: Telemetry Change Guard version or commit
      placeholder: Exact commit SHA or pre-release tag
    validations:
      required: true
  - type: dropdown
    id: workflow
    attributes:
      label: Evaluation workflow
      options:
        - Planned migration
        - Proposed breaking change
        - Control-plane impact
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Change source
      options:
        - Explicit ChangeSet
        - Baseline/candidate snapshots
        - Mapped OpenTelemetry Weaver diff
        - Migration plan
    validations:
      required: true
  - type: dropdown
    id: change
    attributes:
      label: Telemetry change
      options:
        - Metric rename
        - Metric removal
        - Label rename
        - Label removal
        - OpenTelemetry attribute change
        - Multiple changes
    validations:
      required: true
  - type: checkboxes
    id: consumers
    attributes:
      label: Consumer types evaluated
      options:
        - label: Prometheus or PrometheusRule recording/alerting rules
        - label: Grafana dashboards
        - label: Sloth or Pyrra SLOs
        - label: KEDA ScaledObjects
        - label: Argo Rollouts analysis templates
        - label: Explicitly mapped Kubernetes HPA metrics
        - label: Tempo/TraceQL queries
        - label: Transitive recording-rule consumers
  - type: dropdown
    id: expected
    attributes:
      label: Expected status before running Telemetry Change Guard
      options:
        - PASS or READY
        - WARN
        - BLOCK or BLOCKED
        - INCOMPLETE
        - ERROR
        - Unsure
    validations:
      required: true
  - type: dropdown
    id: actual
    attributes:
      label: Actual status
      options:
        - PASS or READY (exit 0)
        - WARN (exit 0)
        - BLOCK or BLOCKED (exit 2)
        - INCOMPLETE (exit 3)
        - ERROR (exit 1)
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: What was correct, missing, or surprising?
      description: Include permanent diagnostic codes and sanitized source evidence.
    validations:
      required: true
  - type: dropdown
    id: required_check
    attributes:
      label: Would you make TCG a required pull-request check today?
      options:
        - Yes
        - No
        - Not yet
    validations:
      required: true
  - type: textarea
    id: required_check_reason
    attributes:
      label: Why or why not?
      description: Describe the deciding value, risk, or missing capability.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal sanitized reproduction
      description: Provide or link the smallest synthetic change, config, and consumer fixture.
  - type: input
    id: duration
    attributes:
      label: Time to first useful result
      placeholder: 12 minutes
  - type: textarea
    id: friction
    attributes:
      label: Workflow friction
      description: What made installation, configuration, analysis, or explanation harder?
  - type: checkboxes
    id: safety
    attributes:
      label: Public-data confirmation
      options:
        - label: This report contains no credentials or sensitive telemetry.
          required: true
        - label: I searched existing issues for the same finding.
          required: true
