apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  name: checkout-migrated-availability
spec:
  target: "99.9"
  window: 2w
  indicator:
    ratio:
      errors:
        metric: checkout_server_request_duration_seconds_count{http_request_method="GET", status=~"5.."}
      total:
        metric: checkout_server_request_duration_seconds_count{http_request_method="GET"}
