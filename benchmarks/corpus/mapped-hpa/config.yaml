apiVersion: tcg/v1alpha1
kind: Config
sources:
  horizontalPodAutoscalers:
    - path: ./benchmarks/corpus/mapped-hpa/hpa.yaml
      mapping: ./benchmarks/corpus/mapped-hpa/mapping.yaml
      required: true
analysis:
  includeTransitiveDependencies: true
  unresolvedReferencePolicy: error
policy:
  failOnCriticalLegacyConsumer: true
  failOnCriticalUnknown: true
  minimumBlockingCriticality: high
output:
  formats: [json]
