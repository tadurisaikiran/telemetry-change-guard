apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: checkout-worker-scaler
  namespace: commerce
  labels:
    environment: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: checkout-worker
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: External
      external:
        metric:
          name: checkout_queue_depth
          selector:
            matchLabels:
              queue: checkout
        target:
          type: AverageValue
          averageValue: "25"
